services:
  postgresql:
    image: postgres:17
    restart: "no"
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lr2
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - lr2-net

  liquibase-migrations:
    container_name: lr2-migrations
    image: liquibase/liquibase:4.29
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - --searchPath=/changesets
      - --changelog-file=changelog.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://postgresql:5432/lr2
      - --username=postgres
      - --password=postgres
      - update
    volumes:
      - ./migrations:/changesets
    networks:
      - lr2-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: "no"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: lr2
      CLICKHOUSE_PASSWORD: lr2
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u lr2 --password lr2 --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - lr2-net

  # REST API (Swagger): upload_mock, mock_to_snowflake, snowflake_to_clickhouse.
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_DATASOURCE_POSTGRES_URL: jdbc:postgresql://postgresql:5432/lr2
      APP_DATASOURCE_POSTGRES_USERNAME: postgres
      APP_DATASOURCE_POSTGRES_PASSWORD: postgres
      APP_DATASOURCE_CLICKHOUSE_URL: jdbc:clickhouse:http://clickhouse:8123/analytics?compress=0
      APP_DATASOURCE_CLICKHOUSE_USERNAME: lr2
      APP_DATASOURCE_CLICKHOUSE_PASSWORD: lr2
    depends_on:
      postgresql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      liquibase-migrations:
        condition: service_completed_successfully
    networks:
      - lr2-net

  # Контейнер со Spark: JAR монтируется из ./target (опционально для spark-submit).
  spark:
    image: apache/spark:4.0.1-scala2.13-java21-ubuntu
    user: root
    command: ["sleep", "infinity"]
    environment:
      PG_JDBC_URL: jdbc:postgresql://postgresql:5432/lr2
      PG_USER: postgres
      PG_PASSWORD: postgres
      CH_JDBC_URL: jdbc:clickhouse:http://clickhouse:8123/analytics
      CH_USER: lr2
      CH_PASSWORD: lr2
      SPARK_MASTER: local[*]
    volumes:
      - ./target:/jobs
      - ./mock_data:/mock_data:ro
    depends_on:
      postgresql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      liquibase-migrations:
        condition: service_completed_successfully
    networks:
      - lr2-net

volumes:
  postgresql_data:
  clickhouse_data:

networks:
  lr2-net:
    driver: bridge
